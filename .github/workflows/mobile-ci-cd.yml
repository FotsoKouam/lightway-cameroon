name: Mobile CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci-cd.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci-cd.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx eslint . --ext .ts,.tsx --max-warnings=0 || true

  build-apk:
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: Install EAS CLI
        run: npm install -g eas-cli
      - name: Build APK (EAS)
        run: eas build --platform android --profile preview --non-interactive
      - name: Download APK artifact
        run: |
          APK_URL=$(eas build:list --platform android --status finished --limit 1 --non-interactive --json | npx --yes node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');console.log(JSON.parse(d)[0].artifacts.buildUrl)")
          curl -L "$APK_URL" -o lightway-cameroon.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lightway-cameroon-apk
          path: apps/mobile/lightway-cameroon.apk
          retention-days: 30
